[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docscanner"
version = "1.0.0"
description = "AmazingScanner — a document scanner built from convolutional networks trained from scratch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dwin Gharibi" }]
keywords = ["document-scanning", "cnn", "corner-detection", "image-enhancement", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.23", "pyarrow>=15.0"]
ocr = ["pytesseract>=0.3.10", "easyocr>=1.7"]
app = ["gradio>=4.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "scikit-image>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
]
all = ["docscanner[data,ocr,app,dev]"]

[project.urls]
Homepage = "https://github.com/dwin-gharibi/AmazingScanner"
Report = "https://github.com/dwin-gharibi/AmazingScanner/blob/main/docs/REPORT.md"
Issues = "https://github.com/dwin-gharibi/AmazingScanner/issues"

[project.scripts]
amazingscanner = "docscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a few seconds — deselect with `-m 'not slow'`",
    "needs_models: requires exported weights in models/",
    "needs_data: requires the prepared datasets in data/",
]

[tool.coverage.run]
source = ["src/docscanner"]
branch = true
omit = ["*/app/*", "*/__main__.py"]

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks", "outputs", "runs", "data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplification
    "RUF",      # ruff's own
    "NPY",      # numpy legacy API (this repo has already been bitten by ptp())
]
ignore = [
    "E501",     # line length is the formatter's job, not an error
    "B008",     # function call in argument default — argparse does this everywhere
    "SIM108",   # ternaries are not always clearer than an if
    "E702",     # `h, w = img.shape[:2]; cx, cy = w / 2, h / 2` reads as one thought
    "E741",     # `l` is the lightness channel in Lab, and renaming it obscures that
    "RUF022",   # __all__ is ordered by what the module does, not alphabetically
    "RUF046",   # `int(round(x))` states the intent; `round(x)` relies on knowing it
    "RUF059",   # `_, _, w, h = rect` documents the shape it is unpacking
    "B905",     # zip(strict=) — see below
]

[tool.ruff.lint.per-file-ignores]
"model.py" = ["F401", "F403"]
"src/docscanner/**/__init__.py" = ["F401"]
"tests/**" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["docscanner"]

[tool.mypy]
python_version = "3.10"
files = ["src/docscanner"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
[[tool.mypy.overrides]]
module = ["docscanner.app.*"]
ignore_errors = true
