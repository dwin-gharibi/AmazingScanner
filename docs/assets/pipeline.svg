<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     role="img" aria-label="The three AmazingScanner pipelines">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f5fb"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#6366f1"/>
    </marker>
    <marker id="arwg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#059669"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3.5"
                                  flood-color="#1e1b4b" flood-opacity=".18"/></filter>
  </defs>

  <style>
    .t  { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h  { font-size: 15px; font-weight: 700; fill: #1e1b4b; }
    .s  { font-size: 12px; fill: #4b5563; }
    .k  { font-size: 11px; font-weight: 600; fill: #6366f1; letter-spacing: .06em; }
    .n  { font-size: 11.5px; fill: #6b7280; }
    .box{ fill: url(#card); stroke: #d7d9ea; }
    .net{ fill: #eef2ff; stroke: #a5b4fc; }
    .cls{ fill: #ecfdf5; stroke: #6ee7b7; }
  </style>

  <rect width="1180" height="470" rx="14" fill="#fbfbfe"/>

  <!-- ============================================================ row 1 -->
  <text class="t k" x="34" y="40">PIPELINE 1 — ENHANCEMENT  (§3.4)</text>
  <text class="t n" x="330" y="40">input is an already-rectified page</text>

  <g transform="translate(34,54)" filter="url(#sh)">
    <rect class="box" width="150" height="76" rx="9"/>
    <text class="t h" x="14" y="30">rectified page</text>
    <text class="t s" x="14" y="50">dim, shadowed,</text>
    <text class="t s" x="14" y="65">colour-cast</text>
  </g>
  <line x1="196" y1="92" x2="238" y2="92" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(250,54)" filter="url(#sh)">
    <rect class="net" width="196" height="76" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="28">DocEnhanceNet</text>
    <text class="t s" x="14" y="47">U-Net, skip connections,</text>
    <text class="t s" x="14" y="62">dilated context · 6.0 M params</text>
  </g>
  <line x1="458" y1="92" x2="500" y2="92" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(512,54)" filter="url(#sh)">
    <rect class="cls" width="176" height="76" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="28">output styling</text>
    <text class="t s" x="14" y="47">colour · grey · B&amp;W ·</text>
    <text class="t s" x="14" y="62">whiteboard · raw</text>
  </g>
  <line x1="700" y1="92" x2="742" y2="92" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(754,54)" filter="url(#sh)">
    <rect class="box" width="150" height="76" rx="9"/>
    <text class="t h" x="14" y="30">clean page</text>
    <text class="t s" x="14" y="50">PNG · PDF ·</text>
    <text class="t s" x="14" y="65">searchable PDF</text>
  </g>

  <!-- ============================================================ row 2 -->
  <text class="t k" x="34" y="182">PIPELINE 2 — CORNER DETECTION  (§5.1)</text>
  <text class="t n" x="380" y="182">input is a raw photograph</text>

  <g transform="translate(34,196)" filter="url(#sh)">
    <rect class="box" width="150" height="76" rx="9"/>
    <text class="t h" x="14" y="30">raw photo</text>
    <text class="t s" x="14" y="50">any angle, any</text>
    <text class="t s" x="14" y="65">surface, any light</text>
  </g>
  <line x1="196" y1="234" x2="238" y2="234" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(250,196)" filter="url(#sh)">
    <rect class="net" width="196" height="76" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="28">CornerHeatmapNet</text>
    <text class="t s" x="14" y="47">4 Gaussian maps +</text>
    <text class="t s" x="14" y="62">page mask, one trunk</text>
  </g>
  <line x1="458" y1="234" x2="500" y2="234" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(512,196)" filter="url(#sh)">
    <rect class="cls" width="176" height="76" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="28">mask-guided decode</text>
    <text class="t s" x="14" y="47">score peak combos by</text>
    <text class="t s" x="14" y="62">strength + mask IoU</text>
  </g>
  <line x1="700" y1="234" x2="742" y2="234" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(754,196)" filter="url(#sh)">
    <rect class="cls" width="176" height="76" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="28">sanity gate</text>
    <text class="t s" x="14" y="47">convex? in frame?</text>
    <text class="t s" x="14" y="62">→ classical → full frame</text>
  </g>
  <line x1="942" y1="234" x2="984" y2="234" stroke="#6366f1" stroke-width="2.4" marker-end="url(#arw)"/>
  <g transform="translate(996,196)" filter="url(#sh)">
    <rect class="box" width="150" height="76" rx="9"/>
    <text class="t h" x="14" y="30">4 corners</text>
    <text class="t s" x="14" y="50">TL · TR · BR · BL</text>
    <text class="t s" x="14" y="65">in photo pixels</text>
  </g>

  <!-- ============================================================ row 3 -->
  <text class="t k" x="34" y="324" fill="#059669">BONUS — END TO END  (§7)</text>
  <text class="t n" x="300" y="324">the two chained: raw photo in, finished scan out</text>

  <g transform="translate(34,338)" filter="url(#sh)">
    <rect class="box" width="128" height="72" rx="9"/>
    <text class="t h" x="14" y="30">raw photo</text>
    <text class="t s" x="14" y="52">no human input</text>
  </g>
  <line x1="174" y1="374" x2="212" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#arwg)"/>
  <g transform="translate(224,338)" filter="url(#sh)">
    <rect class="net" width="150" height="72" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="30">corner detector</text>
    <text class="t s" x="14" y="52">pipeline 2</text>
  </g>
  <line x1="386" y1="374" x2="424" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#arwg)"/>
  <g transform="translate(436,338)" filter="url(#sh)">
    <rect class="cls" width="176" height="72" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="30">homography + warp</text>
    <text class="t s" x="14" y="52">differentiable, pure PyTorch</text>
  </g>
  <line x1="624" y1="374" x2="662" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#arwg)"/>
  <g transform="translate(674,338)" filter="url(#sh)">
    <rect class="net" width="150" height="72" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="30">enhancer</text>
    <text class="t s" x="14" y="52">pipeline 1</text>
  </g>
  <line x1="836" y1="374" x2="874" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#arwg)"/>
  <g transform="translate(886,338)" filter="url(#sh)">
    <rect class="cls" width="140" height="72" rx="9" stroke-width="1.6"/>
    <text class="t h" x="14" y="30">auto-orient</text>
    <text class="t s" x="14" y="52">OSD + profile</text>
  </g>
  <line x1="1038" y1="374" x2="1076" y2="374" stroke="#059669" stroke-width="2.4" marker-end="url(#arwg)"/>
  <g transform="translate(1088,338)" filter="url(#sh)">
    <rect class="box" width="60" height="72" rx="9"/>
    <text class="t h" x="13" y="30">scan</text>
    <text class="t s" x="13" y="52">📄</text>
  </g>

  <text class="t n" x="34" y="446">
    Blue = a network trained here. Green = classical geometry (OpenCV). Nothing is pre-trained or imported.
  </text>
</svg>
