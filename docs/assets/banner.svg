<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" aria-label="AmazingScanner — photograph a page, get a scan">
  <defs>
    <!-- aurora blobs on near-black -->
    <filter id="blur60" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blur34" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ebf7"/>
    </linearGradient>
    <linearGradient id="dim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#8a8168"/>
      <stop offset="55%"  stop-color="#655e4c"/>
      <stop offset="100%" stop-color="#453f33"/>
    </linearGradient>
    <radialGradient id="heat">
      <stop offset="0%"   stop-color="#fb7185" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#f43f5e" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity=".05"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <!-- ------------------------------------------------------------- canvas -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0b0d17"/>
    <ellipse cx="150"  cy="-40" rx="360" ry="200" fill="#4f46e5" fill-opacity=".55" filter="url(#blur60)"/>
    <ellipse cx="820"  cy="460" rx="420" ry="220" fill="#0e7490" fill-opacity=".42" filter="url(#blur60)"/>
    <ellipse cx="1210" cy="30"  rx="300" ry="180" fill="#a21caf" fill-opacity=".30" filter="url(#blur60)"/>
    <ellipse cx="540"  cy="200" rx="220" ry="140" fill="#312e81" fill-opacity=".35" filter="url(#blur60)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <!-- top hairline -->
    <rect x="120" y="0" width="960" height="1.5" fill="url(#hairline)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="19.5" fill="none"
        stroke="#ffffff" stroke-opacity=".10"/>

  <!-- ---------------------------------------------------------------- text -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <!-- eyebrow -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="11" letter-spacing="2.6">
      <text x="66" y="72" fill="#5eead4">FROM-SCRATCH CNN DOCUMENT SCANNER</text>
    </g>

    <text x="63" y="128" font-size="54" font-weight="800" letter-spacing="-2">
      <tspan fill="url(#title)">Amazing</tspan><tspan fill="#f8fafc">Scanner</tspan>
    </text>
    <text x="66" y="165" font-size="19" font-weight="600" fill="#cbd5f5" letter-spacing=".2">
      Photograph a page. Get a scan.
    </text>
    <text x="66" y="192" font-size="14" fill="#8b95c9">
      Two CNNs built from scratch, trained on photographs they
    </text>
    <text x="66" y="211" font-size="14" fill="#8b95c9">
      fabricate for themselves — tested on real ones they have never seen.
    </text>

    <!-- status pills -->
    <g font-size="12" font-weight="600">
      <g transform="translate(66,232)">
        <rect width="118" height="26" rx="13" fill="#ffffff" fill-opacity=".05"
              stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="15" cy="13" r="3" fill="#34d399"/>
        <text x="27" y="17.5" fill="#d7dcf5">OpenCV only</text>
      </g>
      <g transform="translate(194,232)">
        <rect width="164" height="26" rx="13" fill="#ffffff" fill-opacity=".05"
              stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="15" cy="13" r="3" fill="#38bdf8"/>
        <text x="27" y="17.5" fill="#d7dcf5">no pre-trained weights</text>
      </g>
      <g transform="translate(368,232)">
        <rect width="136" height="26" rx="13" fill="#ffffff" fill-opacity=".05"
              stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="15" cy="13" r="3" fill="#e879f9"/>
        <text x="27" y="17.5" fill="#d7dcf5">synthetic dataset</text>
      </g>
    </g>

    <!-- bento metric tiles -->
    <g>
      <g transform="translate(66,286)">
        <rect width="176" height="72" rx="14" fill="#ffffff" fill-opacity=".045"
              stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="14" y="0" width="42" height="2.5" rx="1.25" fill="url(#tileTop)"/>
        <text x="16" y="34" font-size="21" font-weight="800" fill="#f1f5ff">20.6 px</text>
        <text x="16" y="53" font-size="10" fill="#7d8bb8" letter-spacing=".3">MEAN CORNER ERROR</text>
        <text x="16" y="65" font-size="10" fill="#7d8bb8" letter-spacing=".3">24 REAL PHOTOGRAPHS</text>
      </g>
      <g transform="translate(254,286)">
        <rect width="158" height="72" rx="14" fill="#ffffff" fill-opacity=".045"
              stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="14" y="0" width="42" height="2.5" rx="1.25" fill="url(#tileTop)"/>
        <text x="16" y="34" font-size="21" font-weight="800" fill="#f1f5ff">+9.7 dB</text>
        <text x="16" y="53" font-size="10" fill="#7d8bb8" letter-spacing=".3">PSNR GAINED OVER</text>
        <text x="16" y="65" font-size="10" fill="#7d8bb8" letter-spacing=".3">THE DEGRADED INPUT</text>
      </g>
      <g transform="translate(424,286)">
        <rect width="140" height="72" rx="14" fill="#ffffff" fill-opacity=".045"
              stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="14" y="0" width="42" height="2.5" rx="1.25" fill="url(#tileTop)"/>
        <text x="16" y="34" font-size="21" font-weight="800" fill="#f1f5ff">24/24</text>
        <text x="16" y="53" font-size="10" fill="#7d8bb8" letter-spacing=".3">PAGES DETECTED</text>
        <text x="16" y="65" font-size="10" fill="#7d8bb8" letter-spacing=".3">NO FALLBACKS FIRED</text>
      </g>
    </g>
  </g>

  <!-- ------------------------------------------------------- the app window -->
  <g transform="translate(660,52)" filter="url(#drop)">
    <rect width="486" height="296" rx="16" fill="#10132a" fill-opacity=".92"
          stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="30" y="0" width="426" height="1.2" fill="url(#hairline)"/>
    <!-- title bar -->
    <circle cx="22" cy="20" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5.5" fill="#28c840"/>
    <text x="243" y="24.5" text-anchor="middle" font-size="11.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          fill="#6b76a8">amazingscanner scan photo.jpg</text>
    <line x1="0" y1="36" x2="486" y2="36" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- BEFORE: the photographed page, detected -->
    <g transform="translate(36,54)">
      <rect x="-6" y="-6" width="204" height="204" rx="10" fill="#000000" fill-opacity=".30"/>
      <path d="M36 22 L166 40 L152 176 L22 152 Z" fill="url(#dim)"/>
      <path d="M92 20 L176 36 L164 96 L80 80 Z" fill="#05070f" fill-opacity=".34" filter="url(#soft)"/>
      <g stroke="#332f24" stroke-opacity=".8" stroke-width="3" stroke-linecap="round">
        <line x1="48" y1="50"  x2="136" y2="62"/>
        <line x1="47" y1="67"  x2="142" y2="80"/>
        <line x1="45" y1="84"  x2="128" y2="96"/>
        <line x1="44" y1="101" x2="138" y2="115"/>
        <line x1="42" y1="118" x2="116" y2="129"/>
        <line x1="41" y1="135" x2="132" y2="148"/>
      </g>
      <path d="M36 22 L166 40 L152 176 L22 152 Z" fill="url(#mask)"/>
      <circle cx="36"  cy="22"  r="17" fill="url(#heat)"/>
      <circle cx="166" cy="40"  r="17" fill="url(#heat)"/>
      <circle cx="152" cy="176" r="17" fill="url(#heat)"/>
      <circle cx="22"  cy="152" r="17" fill="url(#heat)"/>
      <path d="M36 22 L166 40 L152 176 L22 152 Z" fill="none"
            stroke="#fb7185" stroke-width="2" stroke-opacity=".95"/>
      <g fill="#fecdd3" stroke="#ffffff" stroke-width="1.4">
        <circle cx="36"  cy="22"  r="3.6"/>
        <circle cx="166" cy="40"  r="3.6"/>
        <circle cx="152" cy="176" r="3.6"/>
        <circle cx="22"  cy="152" r="3.6"/>
      </g>
    </g>

    <!-- arrow -->
    <g transform="translate(258,152)">
      <path d="M0 0 H42" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
      <path d="M34 -8 L46 0 L34 8" fill="none" stroke="#2dd4bf" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- AFTER: the scan -->
    <g transform="translate(322,52)">
      <rect width="128" height="204" rx="6" fill="url(#paper)"/>
      <g stroke="#1f2937" stroke-width="3" stroke-linecap="round">
        <line x1="16" y1="26"  x2="110" y2="26"/>
        <line x1="16" y1="46"  x2="114" y2="46"/>
        <line x1="16" y1="66"  x2="100" y2="66"/>
        <line x1="16" y1="86"  x2="112" y2="86"/>
        <line x1="16" y1="106" x2="94"  y2="106"/>
        <line x1="16" y1="126" x2="112" y2="126"/>
        <line x1="16" y1="146" x2="90"  y2="146"/>
        <line x1="16" y1="166" x2="108" y2="166"/>
      </g>
      <rect x="16" y="182" width="54" height="9" rx="4.5" fill="#4f46e5" fill-opacity=".9"/>
    </g>

    <!-- timing readout -->
    <text x="36" y="282" font-size="11.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          fill="#5eead4">✓ detect 148 ms&#160;&#160;·&#160;&#160;enhance 0.4 s&#160;&#160;·&#160;&#160;searchable PDF</text>
  </g>
</svg>
