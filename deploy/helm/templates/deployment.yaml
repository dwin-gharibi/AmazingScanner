apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amazingscanner.fullname" . }}
  labels:
    {{- include "amazingscanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "amazingscanner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "amazingscanner.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "amazingscanner.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: scanner
          image: {{ include "amazingscanner.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "amazingscanner.fullname" . }}-config
          env:
            - name: OMP_NUM_THREADS
              value: {{ .Values.threads | quote }}
            - name: MKL_NUM_THREADS
              value: {{ .Values.threads | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /, port: http }
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: http }
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: { path: /, port: http }
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: models
          {{- if .Values.models.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.models.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: outputs
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "amazingscanner.selectorLabels" . | nindent 14 }}
