apiVersion: v1
kind: Service
metadata:
  name: docscanner
  labels:
    app.kubernetes.io/name: docscanner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docscanner
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docscanner-config
data:
  DOCSCANNER_MODELS: "/app/models"
  GRADIO_SERVER_NAME: "0.0.0.0"
  GRADIO_SERVER_PORT: "7860"
  DOCSCANNER_MAX_SIDE: "1600"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docscanner-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docscanner
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "docscanner"
spec:
  ingressClassName: nginx
  rules:
    - host: docscanner.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docscanner
                port:
                  name: http
  tls:
    - hosts: ["docscanner.example.com"]
      secretName: docscanner-tls
