---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docscanner
  labels:
    app.kubernetes.io/name: docscanner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docscanner
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docscanner
  labels:
    app.kubernetes.io/name: docscanner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docscanner
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docscanner
  labels:
    app.kubernetes.io/name: docscanner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docscanner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 7860
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docscanner
  labels:
    app.kubernetes.io/name: docscanner

automountServiceAccountToken: false
