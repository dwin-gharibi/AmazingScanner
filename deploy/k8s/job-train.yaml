---
apiVersion: batch/v1
kind: Job
metadata:
  name: docscanner-train
  labels:
    app.kubernetes.io/name: docscanner
    app.kubernetes.io/component: training
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docscanner
        app.kubernetes.io/component: training
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: train
          image: ghcr.io/dwin-gharibi/amazingscanner:latest
          command: ["amazingscanner", "all", "--out", "/data/runs", "--threads", "8"]
          env:
            - name: OMP_NUM_THREADS
              value: "8"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "8"
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: docscanner-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docscanner-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 40Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: docscanner-evaluate
  labels:
    app.kubernetes.io/name: docscanner
    app.kubernetes.io/component: evaluation
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: evaluate
              image: ghcr.io/dwin-gharibi/amazingscanner:latest
              command:
                - bash
                - -lc
                - |
                  set -euo pipefail
                  python -m docscanner.eval.evaluate --runs /data/runs --all
                  python -m docscanner.eval.charts
                  python -m docscanner.eval.report
              env:
                - name: OMP_NUM_THREADS
                  value: "4"
              resources:
                requests: {cpu: "4", memory: 4Gi}
                limits:   {cpu: "8", memory: 8Gi}
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: docscanner-data
