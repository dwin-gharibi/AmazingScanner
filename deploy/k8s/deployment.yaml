apiVersion: apps/v1
kind: Deployment
metadata:
  name: docscanner
  labels: &labels
    app.kubernetes.io/name: docscanner
    app.kubernetes.io/component: inference
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docscanner
  template:
    metadata:
      labels: *labels
      annotations:
        checksum/config: "replace-with-configmap-hash"
    spec:
      serviceAccountName: docscanner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner
          image: ghcr.io/dwin-gharibi/amazingscanner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: docscanner-config
          env:
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: docscanner-models
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: outputs
          emptyDir:
            sizeLimit: 1Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docscanner
