default_language_version:
  python: python3

exclude: |
  (?x)^(
      data/.*
    | runs/.*
    | outputs/.*
    | models/.*\.pt
    | docs/assets/.*\.(png|jpg|jpeg|gif|svg)
    | notebooks/.*\.ipynb
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^models/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: validate-manifests
        name: validate deployment manifests
        entry: python scripts/validate_manifests.py
        language: system
        pass_filenames: false
        files: ^(deploy/|docker-compose\.yml|Taskfile\.yml|Makefile|Dockerfile)

      - id: no-stray-checkpoints
        name: no training checkpoints committed
        entry: python scripts/check_no_checkpoints.py
        language: system
        pass_filenames: true
        files: \.(pt|pth|ckpt|onnx)$
